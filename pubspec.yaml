name: puter_cloud_storage
description: "Android client for Puter cloud storage, authenticated with a Puter auth token."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Secure token storage (Android Keystore backed)
  flutter_secure_storage: ^9.2.2

  # HTTP transport for WebDAV (primary) and REST fallback
  dio: ^5.7.0

  # WebDAV multistatus parsing
  xml: ^6.5.0

  # ---------------------------------------------------------------------------
  # Everything below is deliberately NOT declared yet.
  #
  # This pubspec describes what the code uses, not what the roadmap intends. At
  # Phase 1 that is four packages. The rest arrive with the layers that need
  # them, and declaring them early bought nothing but a broken build.
  #
  # It broke in two distinct ways, both worth remembering:
  #
  #   1. flutter_inappwebview 6.1.5 (latest stable, Oct 2024, ~2 years stale)
  #      fails under the Gradle 9.1.0 toolchain Flutter 3.44 generates.
  #      flutter_inappwebview_android 1.1.3 calls
  #      getDefaultProguardFile('proguard-android.txt'), which Gradle 9 rejects
  #      outright. No stable release fixes it; only 6.2.0-beta.3 moves.
  #
  #   2. file_picker compiled against android-34 while a transitive plugin
  #      (flutter_plugin_android_lifecycle) demanded 36, so the build died on a
  #      compileSdk mismatch. Removing it removed the constraint.
  #
  # A stale or lagging plugin cannot break a build it is not part of. Add each
  # one in the phase that uses it, and run `flutter build apk` then — not later.
  #
  # Phase 2 — browse UI:
  #   drift, sqlite3_flutter_libs, path_provider, path, intl, mime
  # Phase 3 — transfers:
  #   crypto, flutter_cache_manager
  # Phase 4 — WebView fallback (see docs/adr/0002):
  #   flutter_inappwebview — BLOCKED, resolve the Gradle 9 conflict first
  # Phase 5 — platform integration:
  #   file_picker, permission_handler, local_auth, workmanager
  # ---------------------------------------------------------------------------

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Pure-Dart test runner, so lib/core and lib/domain can be verified without
  # the Flutter test harness.
  test: ^1.25.15

  # Code generation for Drift — unused until Phase 2 declares drift itself.
  # Commented out rather than removed: `flutter pub get` resolves them today,
  # but they are dead weight until there is a schema to generate from.
  # drift_dev: ^2.22.1
  # build_runner: ^2.4.14

  # Test doubles
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/bridge/
