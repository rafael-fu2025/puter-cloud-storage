name: puter_cloud_storage
description: "Android client for Puter cloud storage, authenticated with a Puter auth token."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Secure token storage (Android Keystore backed)
  flutter_secure_storage: ^9.2.2

  # HTTP transport for WebDAV (primary) and REST fallback
  dio: ^5.7.0

  # WebDAV multistatus parsing
  xml: ^6.5.0

  # Local index — a core component, not a cache. See docs/adr/0003.
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Presentation helpers
  intl: ^0.19.0
  mime: ^1.0.6

  # Device file access — picking what to upload, exporting a download, and
  # opening a downloaded file — is implemented in MainActivity.kt over Android's
  # Storage Access Framework and FileProvider. That is deliberate: a plugin here
  # would pin compileSdk 34 against this app's 36 (docs/build-assessment.md
  # §4.4–4.5), and SAF needs no runtime permission, so permission_handler is
  # absent for the same reason.

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs the real app on a real device, so the pieces that only exist on
  # Android — the Keystore, the SQLite native library, the platform channel,
  # path_provider — are exercised rather than assumed. Dev-only: it is not
  # part of any build output.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Pure-Dart test runner, so lib/core and lib/domain can be verified without
  # the Flutter test harness.
  test: ^1.25.15

  # Code generation for Drift
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

  # Test doubles
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/bridge/
