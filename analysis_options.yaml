include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Unused code is a defect, not a style preference.
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    # Invalid overrides must never reach a build.
    invalid_override: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # --- Deliberately disabled ---
    # Conflicts with private named constructor parameters, which is the pattern
    # used throughout for injected dependencies.
    prefer_initializing_formals: false
    # Flags legitimate async File IO. Blocking the UI thread with sync IO to
    # satisfy a lint would be strictly worse on mobile.
    avoid_slow_async_io: false
    # The `if (x != null) 'key': x` form is clearer than `'key': ?x` and is
    # already used consistently.
    use_null_aware_elements: false

    # --- Safety ---
    # The token is a root credential; accidental interpolation into a log line
    # is the most common leak path. See docs/security.md.
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    prefer_final_in_for_each: true

    # --- Correctness ---
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_returning_null_for_void: true
    cancel_subscriptions: true
    close_sinks: true
    collection_methods_unrelated_type: true
    control_flow_in_finally: true
    empty_statements: true
    hash_and_equals: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    unrelated_type_equality_checks: true
    use_build_context_synchronously: true
    valid_regexps: true

    # --- Async hygiene, which matters for a transfer engine ---
    avoid_void_async: true
    unawaited_futures: true

    # --- Documentation of the non-obvious ---
    # The architecture has deliberate oddities — a per-network request ceiling,
    # a one-attempt auth rule, non-atomic uploads. Those are explained where
    # they are implemented, not only in docs/.
    slash_for_doc_comments: true

    # --- Consistency ---
    directives_ordering: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    unnecessary_lambdas: true
    use_super_parameters: true
